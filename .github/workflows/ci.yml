name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from package.json's packageManager, same as corepack in the Dockerfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # The prepare_* and market-creation tools, end to end on an anvil fork of Base mainnet: every
  # transaction sent is one the tools prepared, and market creation runs against a local
  # stand-in for the backend. Public RPCs stop serving a fork's block after a few minutes, so the
  # fork starts right before the tests.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from package.json's packageManager, same as corepack in the Dockerfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pinned: the suites were written against this anvil, and "stable" moves underneath them.
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start an anvil fork of Base mainnet
        run: |
          anvil --fork-url "${BASE_RPC_URL:-https://base-rpc.publicnode.com}" --port 8545 --silent &
          for i in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 && break; sleep 1; done
        env:
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
      - run: pnpm test:e2e
