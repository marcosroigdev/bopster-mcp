# nginx vhost for the MCP container on 127.0.0.1:8788: TLS, rate limits and an unbuffered /mcp.
# Replace mcp.bopster.fun with your domain, and get the certificate before enabling it
# (see DEPLOYMENT.md).

limit_req_zone $binary_remote_addr zone=mcp_rl:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mcp_burst:10m rate=5r/s;

upstream bopster_mcp {
    server 127.0.0.1:8788;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.bopster.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.bopster.fun;

    ssl_certificate     /etc/letsencrypt/live/mcp.bopster.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.bopster.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---------- Client address ----------
    # Behind Cloudflare the client's address comes in CF-Connecting-IP. It's only believed when the
    # request comes from Cloudflare's ranges (https://www.cloudflare.com/ips); any other client
    # keeps its own address and can't pick one. Rate limits and the MCP's login limit use it.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ---------- Logs ----------
    access_log /var/log/nginx/mcp.bopster.fun.access.log;
    error_log  /var/log/nginx/mcp.bopster.fun.error.log warn;

    # ---------- Hardening ----------
    server_tokens off;
    client_max_body_size 1M;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Rate limiting ----------
    limit_req zone=mcp_rl burst=40 nodelay;
    limit_req_status 429;

    # ---------- Health probe (optional public liveness) ----------
    location = /health {
        proxy_pass http://bopster_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- MCP endpoint ----------
    location /mcp {
        limit_req zone=mcp_burst burst=10 nodelay;

        proxy_pass http://bopster_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replaces whatever the client sent: the MCP limits logins by this header.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Streamable HTTP can stream responses as SSE: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
